<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap">
<style>
:root{--bg:#020b14;--panel:rgba(8,32,52,.72);--cy:#2ee6ff;--cy2:#0a7ea8;--text:#d8f6ff;--muted:#6fa4b8;--warn:#ff6b6b;--gold:#ffc857;
--hud:Orbitron,"Segoe UI",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,#06263d 0%,var(--bg) 70%);color:var(--text);font:16px/1.5 var(--body);overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(46,230,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(46,230,255,.06) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);pointer-events:none;animation:drift 12s linear infinite}
@keyframes drift{to{background-position:0 40px,40px 0}}
body::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);animation:fade .6s ease}
.screen[hidden]{display:none}
@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
button{font:inherit;cursor:pointer;color:inherit}
.btn{font-family:var(--hud);letter-spacing:.14em;font-size:14px;font-weight:700;color:var(--cy);background:rgba(46,230,255,.08);border:1px solid var(--cy);padding:14px 28px;border-radius:4px;box-shadow:0 0 18px rgba(46,230,255,.35),inset 0 0 12px rgba(46,230,255,.15);text-transform:uppercase;transition:.2s}
.btn:hover:not(:disabled){background:rgba(46,230,255,.22);box-shadow:0 0 28px rgba(46,230,255,.6)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}

/* reactor */
.reactor{position:relative;width:min(62vw,260px);aspect-ratio:1}
.reactor svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.r1{transform-origin:50% 50%;animation:spin 14s linear infinite}
.r2{transform-origin:50% 50%;animation:spin 9s linear infinite reverse}
.r3{transform-origin:50% 50%;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.core{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--cy) 45%,transparent 72%);box-shadow:0 0 40px 10px rgba(46,230,255,.7);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 64px 18px rgba(46,230,255,.9)}}
.reactor.mini{width:38px}
.reactor.mini .core{box-shadow:0 0 12px 2px rgba(46,230,255,.8)}

/* intro */
#intro{align-items:center;justify-content:center;gap:26px;text-align:center;padding:24px}
#intro h1{font-family:var(--hud);font-weight:900;font-size:clamp(28px,9vw,52px);letter-spacing:.28em;margin:0;color:var(--cy);text-shadow:0 0 22px rgba(46,230,255,.8)}
#boot{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--muted);min-height:78px;text-align:left}
#boot div::before{content:"> ";color:var(--cy)}
#go{opacity:0;pointer-events:none;transition:opacity .8s}
#go.on{opacity:1;pointer-events:auto}

/* plans */
#plans{padding:20px 16px;overflow-y:auto;align-items:center}
.title{font-family:var(--hud);letter-spacing:.2em;color:var(--cy);text-align:center;margin:8px 0 4px;font-size:clamp(18px,5vw,26px)}
.sub{color:var(--muted);text-align:center;margin:0 0 18px;font-size:14px}
.cards{display:flex;flex-direction:column;gap:14px;width:100%;max-width:420px}
.card{position:relative;text-align:left;background:var(--panel);border:1px solid rgba(46,230,255,.25);border-radius:10px;padding:16px 16px 14px;backdrop-filter:blur(6px);transition:.2s}
.card:hover{border-color:var(--cy)}
.card.sel{border-color:var(--cy);box-shadow:0 0 26px rgba(46,230,255,.45),inset 0 0 22px rgba(46,230,255,.12)}
.card .n{font-family:var(--hud);font-weight:700;letter-spacing:.16em;font-size:16px}
.card .p{font-family:var(--hud);font-size:24px;color:var(--cy);margin:4px 0}
.card .p small{font-size:12px;color:var(--muted)}
.card ul{margin:6px 0 0;padding-left:18px;color:var(--text);font-size:14px}
.tag{position:absolute;top:-10px;right:14px;background:var(--gold);color:#241a00;font:700 11px var(--hud);letter-spacing:.1em;padding:3px 8px;border-radius:3px}
.demo{color:var(--muted);font-size:12px;text-align:center;margin:14px 0}
#plans .btn{margin-bottom:12px}

/* chat */
#chat{background:transparent}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid rgba(46,230,255,.3);background:rgba(2,11,20,.7);backdrop-filter:blur(8px)}
.top .nm{font-family:var(--hud);font-weight:700;letter-spacing:.2em;color:var(--cy);flex:1;line-height:1.2}
.top .nm small{display:block;font:500 11px var(--body);letter-spacing:.06em;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3dff9a;box-shadow:0 0 8px #3dff9a;margin-right:5px}
.mini-btn{font-family:var(--hud);font-size:11px;letter-spacing:.1em;background:none;border:1px solid rgba(46,230,255,.4);color:var(--cy);padding:6px 10px;border-radius:4px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:10px 14px;white-space:pre-wrap;word-wrap:break-word;border-radius:4px 14px 14px 14px;animation:fade .3s ease}
.bot{align-self:flex-start;background:var(--panel);border:1px solid rgba(46,230,255,.35);box-shadow:0 0 14px rgba(46,230,255,.12)}
.user{align-self:flex-end;background:rgba(46,230,255,.16);border:1px solid rgba(46,230,255,.6);border-radius:14px 4px 14px 14px}
.err{color:var(--warn);border-color:var(--warn)}
form{display:flex;gap:10px;padding:10px 12px;border-top:1px solid rgba(46,230,255,.3);background:rgba(2,11,20,.8);align-items:flex-end}
#input{flex:1;padding:11px 14px;border:1px solid rgba(46,230,255,.4);border-radius:6px;background:rgba(8,32,52,.8);color:var(--text);font:inherit;resize:none;max-height:120px;outline:none}
#input:focus{border-color:var(--cy);box-shadow:0 0 14px rgba(46,230,255,.35)}
#send{width:46px;height:46px;border-radius:6px;background:rgba(46,230,255,.15);border:1px solid var(--cy);color:var(--cy);font-size:20px;box-shadow:0 0 14px rgba(46,230,255,.35)}
#send:disabled{opacity:.4}
#prev{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(2,11,20,.8);border-top:1px solid rgba(46,230,255,.3)}
#prev[hidden]{display:none}
#prev img{height:54px;border-radius:6px;border:1px solid var(--cy)}
#prevX{background:none;border:1px solid rgba(46,230,255,.4);color:var(--cy);border-radius:50%;width:28px;height:28px}
#attach{width:46px;height:46px;border-radius:6px;background:rgba(46,230,255,.08);border:1px solid rgba(46,230,255,.5);font-size:20px}
.msg img{display:block;max-width:100%;max-height:200px;border-radius:8px;margin-bottom:6px}
#set{padding:12px 14px;border-bottom:1px solid rgba(46,230,255,.3);background:rgba(2,11,20,.92);display:flex;flex-direction:column;gap:8px;max-height:60%;overflow-y:auto}
#set[hidden]{display:none}
#set label{font-size:12px;color:var(--muted)}
#set .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text)}
#persona{width:100%;box-sizing:border-box;padding:8px;border:1px solid rgba(46,230,255,.4);border-radius:6px;background:rgba(8,32,52,.8);color:var(--text);font:inherit;font-size:14px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.ib{width:46px;height:46px;border-radius:6px;background:rgba(46,230,255,.08);border:1px solid rgba(46,230,255,.5);font-size:19px}
.ib.on{background:rgba(46,230,255,.4)}
.msg{cursor:pointer}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important}}

#panel{padding:12px 16px;border-bottom:1px solid rgba(46,230,255,.3);background:rgba(2,11,20,.85)}
#panel[hidden]{display:none}
#panel label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px;letter-spacing:.06em}
#panel input{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid rgba(46,230,255,.4);border-radius:6px;background:rgba(8,32,52,.8);color:var(--text);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--hud);font-size:11px;letter-spacing:.08em;background:none;border:1px solid rgba(46,230,255,.35);color:var(--muted);padding:6px 10px;border-radius:999px}
.chip.sel{color:var(--cy);border-color:var(--cy);box-shadow:0 0 10px rgba(46,230,255,.4)}
.ibtn{width:46px;height:46px;border-radius:6px;background:rgba(46,230,255,.08);border:1px solid rgba(46,230,255,.5);font-size:20px}
.ibtn.live{border-color:var(--warn);box-shadow:0 0 14px var(--warn);animation:pulse2 1s infinite}
@keyframes pulse2{50%{opacity:.5}}
.cp{display:block;margin-top:6px;background:none;border:0;color:var(--muted);font-size:11px;padding:0}
.top{gap:8px}
.mini-btn{padding:6px 9px}
#panel select{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid rgba(46,230,255,.4);border-radius:6px;background:rgba(8,32,52,.95);color:var(--text);font:inherit}
#panel small{display:block;margin-top:6px;color:var(--muted);font-size:12px}
#panel[hidden],#claudeBox[hidden],#localBox[hidden]{display:none}
body{filter:hue-rotate(var(--hue,0deg))}
.msg img,#prevImg{filter:hue-rotate(calc(var(--hue,0deg) * -1))}
#panel{max-height:62vh;overflow-y:auto}
#panel textarea{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid rgba(46,230,255,.4);border-radius:6px;background:rgba(8,32,52,.8);color:var(--text);font:inherit;resize:vertical}
#openaiBox[hidden]{display:none}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#settings #panel{flex:1;max-height:none;overflow-y:auto;padding:16px 18px 28px;border:0;background:transparent}
#panel input[type=range]{padding:0;border:0;background:none;accent-color:#2ee6ff;height:28px}
#panel .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);margin-top:14px}
#panel .chk input{width:auto}
.msg{font-size:var(--fs,16px)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sugg .chip{font-family:var(--body);font-size:13px;letter-spacing:0;color:var(--text);text-align:left}
.crow{display:flex;gap:14px}
.cp{cursor:pointer}
.cstat{display:none;margin:10px 0;padding:8px 10px;border-radius:6px;font-size:13px;border:1px solid rgba(46,230,255,.3);color:var(--muted);word-break:break-word}
.cstat.info{display:block}
.cstat.good{display:block;color:#3dff9a;border-color:#3dff9a}
.cstat.bad{display:block;color:var(--warn);border-color:var(--warn)}
.conn{margin-top:6px;padding-top:4px;border-top:1px dashed rgba(46,230,255,.25)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rings" viewBox="0 0 200 200">
  <g class="r3" fill="none" stroke="#2ee6ff" stroke-opacity=".5"><circle cx="100" cy="100" r="96" stroke-dasharray="2 8"/></g>
  <g class="r1" fill="none" stroke="#2ee6ff" stroke-width="3"><circle cx="100" cy="100" r="82" stroke-dasharray="90 30 20 30" stroke-linecap="round"/></g>
  <g class="r2" fill="none" stroke="#0a7ea8" stroke-width="6"><circle cx="100" cy="100" r="64" stroke-dasharray="40 14"/></g>
  <circle cx="100" cy="100" r="46" fill="none" stroke="#2ee6ff" stroke-width="1.5"/>
</symbol></defs></svg>

<section class="screen" id="intro">
  <div class="reactor"><svg><use href="#rings"/></svg><div class="core"></div></div>
  <h1>J.A.R.V.I.S.</h1>
  <div id="boot"></div>
  <button class="btn" id="go" type="button">Инициализация</button>
</section>

<section class="screen" id="chat" hidden>
  <div class="top">
    <div class="reactor mini"><svg><use href="#rings"/></svg><div class="core"></div></div>
    <div class="nm">J.A.R.V.I.S.<small><span class="dot"></span><span id="status">LOCAL · БЕСПЛАТНО</span></small></div>
    <button class="mini-btn" id="speak" type="button" title="Озвучка ответов">🔇</button>
    <button class="mini-btn" id="cfg" type="button" title="Настройки">⚙</button>
    <button class="mini-btn" id="new" type="button" title="Новый чат">＋</button>
  </div>
  <div id="log"></div>
  <div id="prev" hidden><img id="prevImg" alt=""><button type="button" id="prevX" aria-label="Убрать фото">✕</button></div>
  <form id="form">
    <button id="attach" type="button" aria-label="Прикрепить фото">📎</button>
    <input type="file" id="file" accept="image/*" hidden>
    <button id="mic" class="ibtn" type="button" aria-label="Голосовой ввод">🎤</button>
    <textarea id="input" rows="1" placeholder="Задайте команду, сэр…"></textarea>
    <button id="send" type="submit" aria-label="Отправить">➤</button>
  </form>
</section>

<section class="screen" id="settings" hidden>
  <div class="top">
    <button class="mini-btn" id="back" type="button">← НАЗАД</button>
    <div class="nm">НАСТРОЙКИ</div>
  </div>
  <div id="panel">
    <label>Режим Джарвиса</label>
    <div class="chips" id="modes"></div>
    <label>Источник ответов</label>
    <div class="chips" id="prov">
      <button class="chip pchip" type="button" data-p="local">Локально (LM Studio)</button>
      <button class="chip pchip" type="button" data-p="claude">Claude API (ключ)</button>
      <button class="chip pchip" type="button" data-p="openai">Бесплатные API</button>
    </div>
    <div id="claudeBox" hidden>
      <label for="key">API-ключ Claude</label>
      <input id="key" type="text" spellcheck="false" autocomplete="off" placeholder="sk-ant-…">
      <button class="chip pst" type="button" data-t="key" style="margin-top:8px">📋 Вставить из буфера</button>
      <label for="cm">Модель</label>
      <select id="cm">
        <option value="claude-haiku-5-5">Haiku 5.5 — быстрая и дешёвая</option>
        <option value="claude-sonnet-5-5">Sonnet 5.5 — баланс</option>
        <option value="claude-opus-5-5">Opus 5.5 — самая умная, дорогая</option>
      </select>
      <small>Ключ виден на экране и хранится только на этом устройстве, не показывайте экран другим. Ответы оплачиваются с вашего счёта в Anthropic.</small>
    </div>
    <div id="localBox">
      <label for="url">Адрес сервера LM Studio</label>
      <input id="url" type="text" autocomplete="off" spellcheck="false" placeholder="localhost:1235">
      <div class="chips" style="margin-top:8px">
        <button class="chip uchip" type="button" data-u="http://localhost:1234">LM Studio 1234</button>
        <button class="chip uchip" type="button" data-u="http://localhost:1235">LM Studio 1235</button>
        <button class="chip uchip" type="button" data-u="http://localhost:11434">Ollama</button>
      </div>
    </div>
    <div id="openaiBox" hidden>
      <label>Бесплатный сервис</label>
      <div class="chips">
        <button class="chip prechip" type="button" data-pr="groq">Groq</button>
        <button class="chip prechip" type="button" data-pr="openrouter">OpenRouter</button>
        <button class="chip prechip" type="button" data-pr="gemini">Gemini</button>
      </div>
      <label for="ob">Адрес API</label>
      <input id="ob" type="text" autocomplete="off">
      <label for="okey">Ключ сервиса</label>
      <input id="okey" type="text" spellcheck="false" autocomplete="off">
      <button class="chip pst" type="button" data-t="okey" style="margin-top:8px">📋 Вставить из буфера</button>
      <label for="om">Модель</label>
      <input id="om" type="text" autocomplete="off">
      <small>Если пишет «модель не найдена», впишите точное имя из списка моделей на сайте сервиса: названия меняются.</small>
    </div>
    <div class="conn">
      <label>Проверка подключения</label>
      <div class="row" style="margin-top:4px">
        <button class="chip" id="scan" type="button">🔍 Найти LM Studio / Ollama</button>
        <button class="chip" id="test" type="button">✔ Проверить</button>
      </div>
      <div id="found" class="chips" style="margin-top:8px"></div>
      <div id="cstat" class="cstat"></div>
      <div id="mpickBox">
        <label for="mpick">Модель из списка сервера</label>
        <select id="mpick"><option value="">— сначала нажмите «Проверить» —</option></select>
      </div>
    </div>
    <label for="persona">Характер Джарвиса (необязательно)</label>
    <textarea id="persona" rows="3" placeholder="Например: ты строгий, но добрый наставник"></textarea>
    <label for="len">Длина ответов</label>
    <select id="len">
      <option value="short">Коротко</option>
      <option value="normal">Обычно</option>
      <option value="long">Подробно</option>
    </select>
    <label>Цвет интерфейса</label>
    <div class="chips">
      <button class="chip hchip" type="button" data-h="0">Голубой</button>
      <button class="chip hchip" type="button" data-h="173">Красный</button>
      <button class="chip hchip" type="button" data-h="218">Золотой</button>
      <button class="chip hchip" type="button" data-h="313">Зелёный</button>
    </div>
    <div class="row">
      <button class="chip" id="exp" type="button">Сохранить чат в файл</button>
      <button class="chip" id="clr" type="button">Очистить чат</button>
    </div>
        <label>Размер текста: <span id="fsv"></span></label>
    <input id="fs" type="range" min="13" max="22" step="1">
    <label>Креативность ответов: <span id="tv"></span></label>
    <input id="tp" type="range" min="0" max="1" step="0.1">
    <label>Скорость озвучки: <span id="rv"></span></label>
    <input id="rt" type="range" min="0.6" max="1.6" step="0.1">
    <label class="chk"><input type="checkbox" id="auto"> Отправлять сразу после диктовки</label>
    <div class="row">
      <button class="chip" id="rst" type="button">Сбросить настройки</button>
    </div>
    <label>Версия: 8</label>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);
const MODES = {
  helper:     { n:'Помощник',    p:'' },
  translator: { n:'Переводчик',  p:'Сейчас ты переводчик: переводи сообщения пользователя с русского на английский, а с любого другого языка на русский. Выводи только перевод.' },
  teacher:    { n:'Учитель',     p:'Сейчас ты терпеливый учитель: объясняй простыми словами, приводи примеры, проверяй понимание.' },
  coder:      { n:'Программист', p:'Сейчас ты опытный программист: давай рабочий код и короткие пояснения.' },
  writer:     { n:'Писатель',    p:'Сейчас ты редактор и копирайтер: улучшай и пиши тексты, предлагай варианты.' }
};
const BASE = 'Ты Джарвис — вежливый, остроумный ИИ-ассистент в футуристичном стиле. Обращайся к пользователю «сэр». Отвечай по-русски, чётко и коротко, с лёгкой иронией, но всегда по делу.';

let cfg = { url:'http://localhost:1234', mode:'helper', speak:false, provider:'local', cmodel:'claude-sonnet-5-5', persona:'', hue:0, lmodel:'', len:'normal', font:16, temp:null, rate:1, auto:false, oBase:'https://api.groq.com/openai/v1', oModel:'llama-3.1-8b-instant' };
const tempOpt = () => (cfg.temp != null ? { temperature: cfg.temp } : {});
let apiKey = '', apiKey2 = '';
try { apiKey = localStorage.getItem('jv_key') || ''; apiKey2 = localStorage.getItem('jv_key2') || ''; } catch (_) {}
try { Object.assign(cfg, JSON.parse(localStorage.getItem('jv_cfg') || '{}')); } catch (_) {}
const saveCfg = () => { try { localStorage.setItem('jv_cfg', JSON.stringify(cfg)); } catch (_) {} };
let history = [];
try { history = JSON.parse(localStorage.getItem('jv_hist') || '[]'); } catch (_) {}
const saveHist = () => { try { localStorage.setItem('jv_hist', JSON.stringify(history.slice(-40))); } catch (_) {} };
let busy = false, ctrl = null, pending = null;

const LENS = { short:' Отвечай очень коротко: 1–3 предложения.', normal:'', long:' Отвечай подробно и развёрнуто, со структурой.' };
const system = () => ((cfg.persona || '').trim() ? cfg.persona.trim() + ' Отвечай по-русски, если не просят иначе.' : BASE) + (LENS[cfg.len] || '') + ' ' + MODES[cfg.mode].p + ' Сейчас: ' + new Date().toLocaleString('ru-RU') + '.';
function show(id){ document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== id); }
function add(kind, text){
  const m = document.createElement('div'); m.className = 'msg ' + kind;
  const t = document.createElement('span'); t.textContent = text; m.appendChild(t);
  $('#log').appendChild(m); $('#log').scrollTop = $('#log').scrollHeight; return t;
}
function addCopy(t, regen){
  const row = document.createElement('div'); row.className = 'crow';
  const b = document.createElement('button'); b.className = 'cp'; b.type = 'button'; b.textContent = 'копировать';
  b.onclick = () => { navigator.clipboard.writeText(t.textContent).then(() => { b.textContent = 'скопировано ✓'; setTimeout(() => b.textContent = 'копировать', 1200); }).catch(() => {}); };
  row.appendChild(b);
  if (regen) {
    const g = document.createElement('button'); g.className = 'cp rg'; g.type = 'button'; g.textContent = 'ещё раз';
    g.onclick = () => {
      if (busy) return;
      const lastUser = [...history].reverse().find(m => m.role === 'user');
      if (!lastUser) return;
      history.pop(); history.pop();
      const ms = document.querySelectorAll('#log .msg');
      ms[ms.length - 1].remove(); ms[ms.length - 2].remove();
      input.value = lastUser.content; $('#form').requestSubmit();
    };
    row.appendChild(g);
  }
  t.parentNode.appendChild(row);
}
function say(text){
  if (!cfg.speak || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*_`#>]/g, '')); u.lang = 'ru-RU'; u.rate = cfg.rate || 1; speechSynthesis.speak(u);
}
function greet(){
  add('bot', 'Добрый день, сэр. Системы в норме. Чем могу помочь?');
  const d = document.createElement('div'); d.className = 'sugg';
  ['Расскажи интересный факт', 'Составь план на день', 'Объясни, как работает нейросеть', 'Придумай идею для проекта'].forEach(x => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = x;
    b.onclick = () => { input.value = x; $('#form').requestSubmit(); };
    d.appendChild(b);
  });
  $('#log').appendChild(d);
}
function restore(){
  $('#log').innerHTML = '';
  if (!history.length) return greet();
  history.forEach(m => { const t = add(m.role === 'user' ? 'user' : 'bot', m.content); if (m.role !== 'user') addCopy(t); });
}

/* заставка */
const lines = ['Загрузка ядра…','Калибровка нейросети…','Системы в норме. Добро пожаловать, сэр.'];
(function boot(i = 0){
  if (i >= lines.length) { setTimeout(() => $('#go').classList.add('on'), 400); return; }
  const d = document.createElement('div'); $('#boot').appendChild(d);
  let k = 0;
  const t = setInterval(() => { d.textContent = lines[i].slice(0, ++k); if (k >= lines[i].length) { clearInterval(t); setTimeout(() => boot(i + 1), 350); } }, 28);
})();
$('#go').onclick = () => { show('chat'); restore(); };

/* настройки */
function refreshUI(){
  $('#status').textContent = ({ local:'LOCAL', claude:'CLAUDE', openai:'API' }[cfg.provider] || 'LOCAL') + ' · ' + MODES[cfg.mode].n.toUpperCase();
  $('#openaiBox').hidden = cfg.provider !== 'openai';
  $('#scan').hidden = cfg.provider !== 'local';
  $('#mpickBox').hidden = cfg.provider === 'claude';
  document.querySelectorAll('.hchip').forEach(c => c.classList.toggle('sel', Number(c.dataset.h) === Number(cfg.hue)));
  document.documentElement.style.setProperty('--hue', (cfg.hue || 0) + 'deg');
  document.documentElement.style.setProperty('--fs', (cfg.font || 16) + 'px');
  $('#fsv').textContent = (cfg.font || 16) + ' px';
  $('#tv').textContent = cfg.temp != null ? cfg.temp : 'авто';
  $('#rv').textContent = (cfg.rate || 1) + '×';
  $('#claudeBox').hidden = cfg.provider !== 'claude';
  $('#localBox').hidden = cfg.provider !== 'local';
  document.querySelectorAll('.pchip').forEach(c => c.classList.toggle('sel', c.dataset.p === cfg.provider));
  $('#speak').textContent = cfg.speak ? '🔊' : '🔇';
  document.querySelectorAll('.chip[data-mode]').forEach(c => c.classList.toggle('sel', c.dataset.mode === cfg.mode));
}
Object.keys(MODES).forEach(k => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.mode = k; b.textContent = MODES[k].n;
  b.onclick = () => { cfg.mode = k; saveCfg(); refreshUI(); };
  $('#modes').appendChild(b);
});
$('#url').value = cfg.url;
$('#url').oninput = e => { cfg.url = e.target.value.trim() || 'http://localhost:1234'; saveCfg(); };
$('#cfg').onclick = () => { show('settings'); $('#panel').scrollTop = 0; };
$('#speak').onclick = () => { cfg.speak = !cfg.speak; if (!cfg.speak && window.speechSynthesis) speechSynthesis.cancel(); saveCfg(); refreshUI(); };
$('#new').onclick = () => { if (busy) return; history = []; saveHist(); restore(); };
document.querySelectorAll('.pchip').forEach(c => c.onclick = () => { cfg.provider = c.dataset.p; saveCfg(); refreshUI(); });
$('#key').value = apiKey;
$('#key').oninput = e => { apiKey = e.target.value.trim(); try { localStorage.setItem('jv_key', apiKey); } catch (_) {} };
$('#cm').value = cfg.cmodel;
$('#cm').onchange = e => { cfg.cmodel = e.target.value; saveCfg(); };
const PRESETS = {

/* ===== Калибровка подключения ===== */
function normUrl(u){
  u = (u || '').trim().replace(/\s+/g, '');
  if (!u) return 'http://localhost:1234';
  if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
  return u.replace(/\/+$/, '').replace(/\/v1$/, '');
}
function setStat(text, cls){ const e = $('#cstat'); e.textContent = text; e.className = 'cstat ' + (cls || 'info'); }
function setDot(ok){
  const d = document.querySelector('.top .dot'); if (!d) return;
  d.style.background = ok ? '#3dff9a' : '#ff6b6b'; d.style.boxShadow = '0 0 8px ' + (ok ? '#3dff9a' : '#ff6b6b');
}
async function probe(base, ms){
  const c = new AbortController(), tm = setTimeout(() => c.abort(), ms || 1500), t0 = performance.now();
  try {
    const r = await fetch(base + '/v1/models', { signal:c.signal });
    const j = await r.json();
    return { ok:true, ms:Math.round(performance.now() - t0), models:(j.data || []).map(x => x.id) };
  } catch (_) { return { ok:false }; } finally { clearTimeout(tm); }
}
function fillModels(list){
  const sel = $('#mpick'); sel.innerHTML = '';
  const ids = (list || []).filter(x => !/embed/i.test(x)).slice(0, 300);
  if (!ids.length) { sel.innerHTML = '<option value="">моделей нет (загрузите модель)</option>'; return; }
  ids.forEach(id => { const o = document.createElement('option'); o.value = id; o.textContent = id; sel.appendChild(o); });
  const cur = cfg.provider === 'openai' ? cfg.oModel : cfg.lmodel;
  if (ids.includes(cur)) sel.value = cur;
}
function pickServer(h, r){
  cfg.url = h; saveCfg(); $('#url').value = h; fillModels(r.models); setDot(true);
  setStat('✓ Подключено: ' + h + ' · ' + r.ms + ' мс · моделей: ' + r.models.length + (r.models.length ? '' : ' (загрузите модель в LM Studio)'), 'good');
}

$('#scan').onclick = async () => {
  setStat('Ищу серверы на этом компьютере…', 'info'); $('#found').innerHTML = '';
  const hosts = [1234, 1235, 1236, 11434, 8080, 8000, 5000].map(p => 'http://localhost:' + p);
  const res = (await Promise.all(hosts.map(async h => ({ h, r: await probe(h) })))).filter(x => x.r.ok);
  if (!res.length) { setStat('Сервер не найден. В LM Studio откройте Local Model API и включите сервер (или запустите Ollama). Если страница открыта по https (например, на iPhone), локальный сервер недоступен.', 'bad'); return; }
  res.forEach(x => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    b.textContent = x.h.replace('http://', '') + ' · моделей: ' + x.r.models.length;
    b.onclick = () => pickServer(x.h, x.r);
    $('#found').appendChild(b);
  });
  if (res.length === 1) pickServer(res[0].h, res[0].r); else setStat('Найдено серверов: ' + res.length + '. Нажмите на нужный.', 'good');
};
$('#test').onclick = async () => {
  setStat('Проверяю…', 'info');
  const t0 = performance.now(), ms = () => Math.round(performance.now() - t0);
  const hint = st => st === 401 || st === 403 ? 'ключ не подошёл' : st === 404 ? 'адрес или модель не найдены' : st === 429 ? 'превышен лимит запросов' : 'ошибка сервера';
  try {
    if (cfg.provider === 'local') {
      const base = normUrl(cfg.url), r = await probe(base, 4000);
      if (!r.ok) throw 'Нет ответа от ' + base + '. Проверьте: сервер запущен, порт верный (попробуйте «Найти»), CORS включён.';
      pickServer(base, r);
    } else if (cfg.provider === 'claude') {
      if (!apiKey) throw 'Сначала вставьте ключ Claude.';
      const r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST',
        headers:{ 'content-type':'application/json', 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
        body: JSON.stringify({ model:cfg.cmodel, max_tokens:1, messages:[{ role:'user', content:'hi' }] }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw '[' + r.status + '] ' + hint(r.status) + (j.error && j.error.message ? ': ' + j.error.message : '');
      setDot(true); setStat('✓ Ключ работает · ' + ms() + ' мс · модель ' + cfg.cmodel, 'good');
    } else {
      if (!apiKey2) throw 'Сначала вставьте ключ сервиса.';
      const base = (cfg.oBase || '').trim().replace(/\/+$/, '');
      const r = await fetch(base + '/models', { headers:{ Authorization:'Bearer ' + apiKey2 } });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw '[' + r.status + '] ' + hint(r.status);
      const list = (j.data || []).map(x => x.id);
      fillModels(list); setDot(true);
      setStat('✓ Сервис отвечает · ' + ms() + ' мс · моделей в списке: ' + list.length + '. Выберите модель ниже.', 'good');
    }
  } catch (e) {
    setDot(false);
    setStat('✗ ' + (typeof e === 'string' ? e : 'Нет связи: проверьте интернет, адрес и ключ.'), 'bad');
  }
};

/* ===== Команды чата ===== */
function runCmd(c){
  const parts = c.slice(1).trim().split(/\s+/), cmd = (parts.shift() || '').toLowerCase(), arg = parts.join(' ').toLowerCase();
  const out = x => add('bot', x);
  if (cmd === 'помощь') out('Команды:\n/очистить — новый чат\n/время — дата и время\n/режим <название> — сменить режим\n/настройки — открыть настройки\n/проверка — проверить подключение');
  else if (cmd === 'очистить') $('#new').click();
  else if (cmd === 'время') out(new Date().toLocaleString('ru-RU', { dateStyle:'full', timeStyle:'short' }));
  else if (cmd === 'режим') {
    const k = arg && Object.keys(MODES).find(k => MODES[k].n.toLowerCase().startsWith(arg));
    if (k) { cfg.mode = k; saveCfg(); refreshUI(); out('Режим: ' + MODES[k].n); }
    else out('Доступные режимы: ' + Object.values(MODES).map(m => m.n).join(', '));
  }
  else if (cmd === 'настройки') show('settings');
  else if (cmd === 'проверка') { show('settings'); $('#test').click(); }
  else out('Не знаю такой команды. Напишите /помощь.');
}

/* Claude API */
async function askClaude(imgUrl, onText){
  if (!apiKey) throw { server: 'Не указан API-ключ. Откройте ⚙ и вставьте ключ Claude.' };
  const msgs = history.slice(-20).map(m => ({ role:m.role, content:m.content }));
  if (imgUrl) {
    const last = msgs[msgs.length - 1];
    last.content = [{ type:'image', source:{ type:'base64', media_type:'image/jpeg', data:imgUrl.split(',')[1] } }, { type:'text', text:last.content }];
  }
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', signal: ctrl.signal,
    headers: { 'content-type':'application/json', 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ ...tempOpt(), model:cfg.cmodel, max_tokens: cfg.len === 'long' ? 2000 : 1024, stream:true, system:system(), messages:msgs })
  });
  if (!resp.ok) {
    let m = '';
    try { const j = await resp.json(); m = (j.error && j.error.message) || JSON.stringify(j); } catch (_) {}
    throw { server: '[' + resp.status + '] ' + m };
  }
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = '', out = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream:true });
    const parts = buf.split('\n'); buf = parts.pop();
    for (const l of parts) {
      if (!l.startsWith('data:')) continue;
      try {
        const j = JSON.parse(l.slice(5).trim());
        if (j.type === 'content_block_delta' && j.delta && j.delta.text) { out += j.delta.text; onText(out); }
      } catch (_) {}
    }
  }
}

/* Бесплатные OpenAI-совместимые сервисы */
async function askOpenAI(imgUrl, onText){
  if (!apiKey2) throw { server: 'Не указан ключ. Откройте ⚙ и вставьте ключ сервиса.' };
  const base = cfg.oBase.trim().replace(/\/+$/, '');
  const msgs = history.slice(-20).map(m => ({ role:m.role, content:m.content }));
  if (imgUrl) { const last = msgs[msgs.length - 1]; last.content = [{ type:'text', text:last.content }, { type:'image_url', image_url:{ url:imgUrl } }]; }
  const resp = await fetch(base + '/chat/completions', {
    method: 'POST', signal: ctrl.signal,
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + apiKey2 },
    body: JSON.stringify({ ...tempOpt(), model:cfg.oModel, stream:true, messages:[{ role:'system', content:system() }, ...msgs] })
  });
  if (!resp.ok) {
    let m = '';
    try { const j = await resp.json(); const e = Array.isArray(j) ? j[0] : j; m = (e.error && (e.error.message || JSON.stringify(e.error))) || JSON.stringify(e); } catch (_) {}
    throw { server: '[' + resp.status + '] ' + m };
  }
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = '', out = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream:true });
    const parts = buf.split('\n'); buf = parts.pop();
    for (const l of parts) {
      if (!l.startsWith('data:')) continue;
      const d = l.slice(5).trim();
      if (d === '[DONE]') continue;
      try { const c = JSON.parse(d).choices[0].delta.content || ''; if (c) { out += c; onText(out); } } catch (_) {}
    }
  }
}

/* фото */
function clearPhoto(){ pending = null; $('#prev').hidden = true; $('#file').value = ''; }

$('#file').onchange = e => { const f = e.target.files[0]; if (!f) return; pending = f; $('#prevImg').src = URL.createObjectURL(f); $('#prev').hidden = false; };
async function photoUrl(f){
  const bmp = await createImageBitmap(f);
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.85);
}

/* голосовой ввод */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { $('#mic').hidden = true; } else {
  let rec = null, on = false;
  $('#mic').onclick = () => {
    if (on) { rec.stop(); return; }
    rec = new SR(); rec.lang = 'ru-RU'; rec.interimResults = false;
    rec.onresult = ev => { input.value = (input.value + ' ' + ev.results[0][0].transcript).trim(); input.dispatchEvent(new Event('input')); if (cfg.auto) $('#form').requestSubmit(); };
    rec.onend = () => { on = false; $('#mic').classList.remove('live'); };
    rec.onerror = () => { add('bot err', 'Голосовой ввод в этом окне недоступен, сэр. Он работает в Jarvis.bat (Edge).'); };
    rec.start(); on = true; $('#mic').classList.add('live');
  };
}

/* чат */
const input = $('#input');
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#form').requestSubmit(); } });

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) { if (ctrl) ctrl.abort(); return; }
  const text = input.value.trim() || (pending ? 'Опиши, что на фотографии.' : '');
  if (!text) return;
  if (text.startsWith('/') && !pending) { input.value = ''; input.style.height = 'auto'; return runCmd(text); }
  if (window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll('.sugg, .rg').forEach(e => e.remove());
  busy = true; $('#send').textContent = '■';
  input.value = ''; input.style.height = 'auto';
  const photo = pending;
  const ut = add('user', text);
  let imgUrl = null;
  if (photo) {
    try { imgUrl = await photoUrl(photo); const im = document.createElement('img'); im.src = imgUrl; ut.parentNode.prepend(im); } catch (_) {}
  }
  clearPhoto();
  history.push({ role:'user', content:text });
  const t = add('bot', '▮▮▮'); let full = '', aborted = false;
  ctrl = new AbortController();
  try {
    const msgs = history.slice(-20).map(m => ({ role:m.role, content:m.content }));
    if (imgUrl) { const last = msgs[msgs.length - 1]; last.content = [{ type:'text', text:last.content }, { type:'image_url', image_url:{ url:imgUrl } }]; }
    if (cfg.provider === 'claude') {
      await askClaude(imgUrl, txt => { full = txt; t.textContent = txt; $('#log').scrollTop = $('#log').scrollHeight; });
    } else if (cfg.provider === 'openai') {
      await askOpenAI(imgUrl, txt => { full = txt; t.textContent = txt; $('#log').scrollTop = $('#log').scrollHeight; });
    } else {
    const norm = normUrl;
    let base = norm(cfg.url), model = 'local-model';
    for (const c of [...new Set([norm(cfg.url), 'http://localhost:1235', 'http://localhost:1234'])]) {
      try {
        const mr = await fetch(c + '/v1/models', { signal: ctrl.signal });
        const mj = await mr.json();
        base = c;
        const ids = (mj.data || []).map(x => x.id);
        const m = ids.find(x => x === cfg.lmodel) || ids.find(x => !/embed/i.test(x));
        if (m) model = m;
        break;
      } catch (e) { if (e && e.name === 'AbortError') throw e; }
    }
    if (base !== norm(cfg.url)) { cfg.url = base; saveCfg(); $('#url').value = base; }
    const resp = await fetch(base + '/v1/chat/completions', {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...tempOpt(), model, stream:true, messages:[{ role:'system', content:system() }, ...msgs] })
    });
    const ct = resp.headers.get('content-type') || '';
    if (!resp.ok || ct.indexOf('text/event-stream') < 0) {
      const raw = await resp.text();
      let msg = raw;
      try {
        const j = JSON.parse(raw);
        if (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) full = j.choices[0].message.content;
        else msg = (j.error && (j.error.message || JSON.stringify(j.error))) || raw;
      } catch (_) {}
      if (!full) throw { server: ('[' + resp.status + '] ' + String(msg).slice(0, 300)) };
      t.textContent = full;
    }
    const reader = full ? null : resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (reader) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const parts = buf.split('\n'); buf = parts.pop();
      for (const l of parts) {
        if (!l.startsWith('data:')) continue;
        const d = l.slice(5).trim();
        if (d === '[DONE]') continue;
        try {
          const c = JSON.parse(d).choices[0].delta.content || '';
          full += c; if (full) { t.textContent = full; $('#log').scrollTop = $('#log').scrollHeight; }
        } catch (_) {}
      }
    }
    }
  } catch (err) {
    if (err.name === 'AbortError') aborted = true;
    if (err.name !== 'AbortError' && !full) {
      setDot(false); history.pop(); t.parentNode.classList.add('err');
      t.textContent = cfg.provider === 'claude'
        ? (err.server ? 'Claude ответил: ' + err.server : 'Нет связи с Claude, сэр. Проверьте интернет и ключ в настройках (⚙).')
        : cfg.provider === 'openai'
        ? (err.server ? 'Сервис ответил: ' + err.server : 'Нет связи с сервисом, сэр. Проверьте интернет, адрес API и ключ в настройках (⚙).')
        : (err.server ? ('LM Studio ответил: ' + err.server + '\n\nЕсли там написано про загрузку модели, откройте Loaded Instances и загрузите Gemma.') : 'Нет связи с LM Studio, сэр. Откройте ⚙ и нажмите «Найти LM Studio / Ollama».');
    }
  }
  if (full) { setDot(true); history.push({ role:'assistant', content:full }); saveHist(); addCopy(t, true); say(full); }
  else if (!t.parentNode.classList.contains('err')) {
    history.pop();
    if (aborted) t.textContent = 'Остановлено.';
    else { t.parentNode.classList.add('err'); t.textContent = 'Сервер вернул пустой ответ, сэр. В настройках (⚙) адрес должен быть http://localhost:1235, и модель должна быть загружена в LM Studio.'; }
  }
  busy = false; $('#send').textContent = '➤'; ctrl = null;
});
